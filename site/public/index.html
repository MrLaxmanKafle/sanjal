<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanjal · Your agent, working for you</title>
<meta name="description" content="Sanjal. Your agent, working for you. Coming soon.">
<style>
  :root { --bg:#fbfaf7; --text:#16181d; --muted:#5d6470; --accent:#0f5f4b; --line:#d9d6cf; --field:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1113; --text:#f1efe9; --muted:#a3a9b3; --accent:#5fd0ae; --line:#2a2f35; --field:#161a1d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5;
    display:flex; flex-direction:column; }
  main { flex:1; display:flex; flex-direction:column; justify-content:center;
    max-width:620px; width:100%; margin:0 auto; padding:48px 20px; }
  .brand { font-weight:700; letter-spacing:.02em; font-size:1.1rem; color:var(--accent); }
  h1 { font-size:clamp(2.2rem, 8vw, 3.4rem); line-height:1.05; letter-spacing:-.02em; margin:20px 0 32px; }
  p.lead { font-size:1.15rem; color:var(--muted); margin:0 0 28px; max-width:34em; }
  .soon { font-size:.85rem; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--accent); margin-bottom:12px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 220px; min-width:0; padding:14px 16px; font:inherit; color:var(--text);
    background:var(--field); border:1px solid var(--line); border-radius:10px; }
  button { padding:14px 20px; font:inherit; font-weight:600; border:0; border-radius:10px;
    background:var(--accent); color:var(--bg); cursor:pointer; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #note { min-height:1.5em; margin:12px 0 0; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:20px; }
</style>
</head>
<body>
<main>
  <div class="brand">Sanjal</div>
  <h1>Your agent, working for you.</h1>
  <div class="soon">Coming soon</div>
  <form id="waitlist" method="post" action="/api/waitlist">
    <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>
    <button type="submit">Get early access</button>
  </form>
  <p id="note" role="status" aria-live="polite"></p>
</main>
<footer>© Sanjal · sanjal.com</footer>
<script>
  const form = document.getElementById('waitlist');
  const note = document.getElementById('note');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    note.textContent = '';
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: form.email.value }),
      });
      const data = await res.json();
      if (data.ok) {
        form.reset();
        note.textContent = "You're on the list. We'll email you when Sanjal opens.";
      } else if (data.error === 'invalid_email') {
        note.textContent = 'Please check the email address and try again.';
      } else {
        note.textContent = 'Something went wrong. Please try again in a moment.';
      }
    } catch {
      note.textContent = 'Something went wrong. Please try again in a moment.';
    }
    button.disabled = false;
  });
</script>
</body>
</html>
