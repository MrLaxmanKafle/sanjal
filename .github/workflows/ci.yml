name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Expo generates this on `expo start`; CI never runs that, so write it here.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_OFFLINE: 1
